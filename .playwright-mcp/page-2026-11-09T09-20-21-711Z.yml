        - tabpanel "Autofill" [ref=e228]:
          - generic [ref=e235]:
            - paragraph [ref=e239]: Your Google Account helps you save time by automatically filling in passwords, addresses, and payment details using the information you’ve saved to your account.
            - img "Lottie animation" [ref=e244]
