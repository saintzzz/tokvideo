          - paragraph
          - paragraph [ref=e176]: When you’re signed in, all of the Google services you use work together seamlessly to offer help with everyday tasks like syncing your Gmail with your Google Calendar and Google Maps to make sure you’re always on top of your schedule.
          - paragraph
        - generic [ref=e180]:
          - heading "Built for you" [level=2] [ref=e181]
          - paragraph
