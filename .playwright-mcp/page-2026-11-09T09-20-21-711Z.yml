      - heading "Just for you" [level=2] [ref=e340]
      - generic [ref=e343]: Your Google Account makes every service you use personalized to you. Just sign into your account to access your preferences, privacy and personalization controls from any device.
      - generic [ref=e354]:
        - tablist [ref=e355]:
          - tab "Instant access" [selected] [ref=e356] [cursor=pointer]
          - tab "Privacy controls" [ref=e357] [cursor=pointer]
          - tab "A safe place for your info" [ref=e358] [cursor=pointer]
        - tabpanel "Instant access" [ref=e360]:
          - generic [ref=e367]:
            - paragraph [ref=e371]: You’re never more than a tap away from your data and settings. Just tap your profile picture and follow the link to “Manage your Google Account”. From your profile picture, you can also easily sign in, sign out, or turn on Incognito mode.
            - img "Lottie animation" [ref=e376]
      - img "Keeping your information private,safe, and secure" [ref=e450]
      - heading "Keeping your information private, safe, and secure" [level=2] [ref=e460]
      - generic [ref=e463]: Protecting all the information in your Google Account has never been more important. That’s why we’ve built powerful protections and tools like the Security Checkup and Google Password Manager into every account.
      - generic [ref=e474]:
        - tablist [ref=e475]:
          - tab "Built-in security" [selected] [ref=e476] [cursor=pointer]
          - tab "Security Checkup" [ref=e477] [cursor=pointer]
          - tab "Google Password Manager" [ref=e478] [cursor=pointer]
        - tabpanel "Built-in security" [ref=e480]:
          - generic [ref=e487]:
            - paragraph [ref=e491]: Your Google Account automatically protects your personal information and keeps it private and safe. Every account comes with powerful features like spam filters that block 99.9% of dangerous emails before they ever reach you, and personalized security notifications that alert you of suspicious activity and malicious websites.
            - img "Lottie animation" [ref=e496]
