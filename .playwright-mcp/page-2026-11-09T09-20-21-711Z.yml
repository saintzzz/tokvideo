      - img "Ready to help" [ref=e198]
      - heading "Ready to help" [level=2] [ref=e208]
      - generic [ref=e211]: Google services, from Chrome to YouTube, work better and help you do more when you’re signed in. Your account gives you access to helpful features like Autofill, personalized recommendations, and much more — any time on any device.
