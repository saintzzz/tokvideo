name: Update long-form metadata

# Retroactive metadata pass on already-published long-form videos:
# keyword-first titles + prev/next/playlist links in descriptions.
# Triggered by repository_dispatch so a repo-scoped token can fire it:
#   POST /repos/{owner}/{repo}/dispatches
#   { "event_type": "update-long-metadata",
#     "client_payload": { "slugs": ["hu-ma-ga-tap-01", ...] } }
# An empty slugs list updates every episode in published-long.json.
on:
  repository_dispatch:
    types: [update-long-metadata, update-long-thumbnails]

permissions:
  contents: read

jobs:
  update-thumbnails:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'update-long-thumbnails'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install real ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rebuild + set thumbnails
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for slug in ${{ join(github.event.client_payload.slugs, ' ') }}; do
            node scripts/make-long-thumbnail.mjs "$slug" || true
          done
          node scripts/set-long-thumbnail.mjs ${{ join(github.event.client_payload.slugs, ' ') }}

  update-metadata:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'update-long-metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update published long-form metadata
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLUGS: ${{ join(github.event.client_payload.slugs, ' ') }}
        run: node scripts/update-long-metadata.mjs $SLUGS
