name: Reply to Suc Khoe comments

# Replies to genuine new comments on the channels' OWN videos — safe,
# low-risk engagement (talking to your own audience, not soliciting
# anyone) and a real ranking signal: YouTube reads back-and-forth
# conversation on a video as an engaged-audience signal and rewards it
# with more reach. See scripts/reply-comments-prompt.txt for the actual
# rules (compliance, tone, what to skip).
#
# No-ops harmlessly (same pattern as the daily content writer) until
# ANTHROPIC_API_KEY is set. Also needs YOUTUBE_REFRESH_TOKEN /
# YOUTUBE_EN_REFRESH_TOKEN issued with the youtube.force-ssl scope — an
# older manage-only token fails here with "insufficient authentication
# scopes" (see scripts/youtube-get-refresh-token.mjs).

on:
  workflow_dispatch: {}
  schedule:
    # Once daily — comment volume on a small channel is low enough that
    # daily is plenty to keep replies timely without needing anything
    # fancier.
    - cron: "0 9 * * *"

jobs:
  reply-comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run comment reply job
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Skipping: ANTHROPIC_API_KEY secret not set."
            exit 0
          fi
          claude -p "$(cat scripts/reply-comments-prompt.txt)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --dangerously-skip-permissions
