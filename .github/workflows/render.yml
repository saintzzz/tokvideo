name: Truyen Ma Dai Ky pipeline

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Job to run (the Truyen Ma Dai Ky channel is the only live pipeline - 2026-11-28 cleanup removed all dead channels)."
        type: choice
        options: [auto, channel-report, set-video-privacy, suckhoe-long, suckhoe-long-next, suckhoe-teaser-ahead, pipeline-doctor, pipeline-watchdog, channel-review]
        default: auto
      privacy_status:
        description: "set-video-privacy only: private, public, or unlisted"
        type: choice
        options: [private, public, unlisted]
        default: private
      video_ids:
        description: "set-video-privacy only: space-separated YouTube video IDs"
        type: string
        default: ""
      long_form_slug:
        description: "suckhoe-long only: which long-form episode slug to generate/render/upload (any slug in src/suckhoe/long-form/)"
        type: string
        default: "kiem-hon-thuc-tinh-tap-01"
  # repository_dispatch lets automation (a repo-scoped token — the
  # workflow_dispatch endpoint needs the broader `workflow` scope)
  # trigger one long-form publish: POST /dispatches with
  # event_type=publish-long and client_payload {slug, privacy?}.
  repository_dispatch:
    types: [publish-long]
  schedule:
    # Once daily — pulls real channel/video stats (subscribers, views,
    # watch time, per-video performance) into the job log via
    # scripts/channel-report.mjs, so cadence/content decisions have actual
    # data behind them instead of guesswork. No-ops harmlessly until the
    # YOUTUBE_* secrets carry a token with the readonly/analytics scopes
    # (see scripts/youtube-get-refresh-token.mjs).
    #
    # Minute offset :40 (2026-08-27) for the same reason as the
    # release-shelved cron above — this shares the 0h slot with the EN
    # publish cron and landing on the exact same minute made a stale-
    # checkout push race more likely.
    - cron: "40 0 * * *"
    # Long-form story publishing, 6x/day (owner directive 2026-10-13:
    # "1 ngày phải đăng đủ số tập của 1 câu chuyện" — a whole 5-episode
    # arc ships inside one day, spread across VN peak hours instead of
    # the 2026-10-10 all-in-10-minutes dump that buried taps 2-5).
    # Each tick runs the full pipeline for the next unpublished episode
    # in src/suckhoe/long-form/ — voiceover, render, thumbnail, upload,
    # ledger commit — picking the slug via scripts/next-long-form-slug.mjs
    # and no-opping when the queue is drained. Slots (VN, UTC+7):
    # 05:30 / 10:30 / 13:30 / 16:30 / 19:30 / 22:30 — morning commute,
    # lunch, afternoon, and the 19-23h horror prime window. Uploads land
    # ~40-60min after each tick. New arcs can only start on the 05:30
    # slot (enforced in the picker) so a 5-ep arc always completes the
    # same VN day. :30 offsets avoid exact-minute collisions with the
    # other crons' checkouts.
    # 2026-11-08 PO call: 6 ticks/day = ~10+ uploads on a suppressed
    # 264-sub channel - re-triggered the spam classifier AND hit the
    # literal YouTube API upload quota (mieu-hoang-tap-05 failed with
    # uploadLimitExceeded). Cut to 3 ticks/day (05:30, 13:30, 19:30 VN =
    # 3 long + 3 teaser) until channel-report shows teaser views back
    # above ~100/video consistently, then restore 6.
    - cron: "30 22,6,12 * * *"
    # Backup arc-start slot (2026-11-24: GitHub dropped the 22:30 cron
    # twice in 2 weeks — the second time cost the whole morning window
    # and the arc started ~10h late). Fires at 06:45 VN, still inside
    # the weekday arc-start window; the pick step below stands down
    # whenever the primary slot actually produced a run.
    - cron: "45 22 * * *"
    # Weekend boost (owner directive 2026-11-14): viewers are off work
    # Sat-Sun so two extra slots (09:30 + 16:30 VN) take weekends to
    # 5 long + 5 teaser/day, evenly spaced ~4h apart to stay under the
    # channel's daily-upload ceiling. Upload quota is pooled across two
    # GCP projects (upload scripts fall back to *_2 creds on
    # quotaExceeded) - 10 inserts/day needs more than one 10k pool.
    - cron: "30 2,9 * * 6,0"
    # Teaser-ahead (owner directive 2026-11-19): the Shorts feed is the
    # channel's only reliable discovery surface (~800 views/short vs ~3
    # for longs), but teasers only existed as a side-effect of long
    # uploads — when the long queue stalled, the feed starved for 2
    # days. This slot uploads the teaser Short of an unpublished episode
    # BEFORE its long lands, 3x/day at 10:30/16:30/22:30 VN — interleaved
    # with the long slots so Shorts keep flowing even on render-fail days.
    - cron: "30 3,9,15 * * *"
    # Weekend shorts boost — two extra teaser slots (07:30 + 14:30 VN)
    # take Sat/Sun to 5 shorts/day to match the 5-long weekend cadence.
    - cron: "30 0,7 * * 6,0"
    # Once daily — pipeline watchdog + self-heal (owner directive
    # 2026-10-24: "check thấy fail thì tự fix"). Runs scripts/
    # pipeline-doctor.mjs: verifies every ledger videoId is still public
    # on the channel (dead entries are removed so the episode
    # re-queues), recovers orphan uploads whose ledger commit lost a
    # rebase race, backfills missing teaser Shorts for published
    # episodes, and reports queue depth. Committed to
    # src/suckhoe/pipeline-doctor.md so the state is visible without
    # anyone asking. 16:45 UTC = 23:45 VN — after the day's last
    # long-form tick's upload has had time to land and settle.
    - cron: "45 16 * * *"
    # Watchdog every 3h at :13 (off-collision with the other crons):
    # classifies failed runs, reruns transient failures, auto-registers
    # missing compositions, and refills the story queue when the
    # unpublished backlog drops below 5 episodes — owner directive
    # 2026-11-06, pipeline must self-heal without manual intervention.
    - cron: "13 */3 * * *"
    # Weekly channel self-review: Sunday 20:00 VN (13:00 UTC) - pulls
    # per-video stats, ranks arcs, writes strategy directives that
    # steer the next auto-written arcs.
    - cron: "0 13 * * 0"

jobs:
  channel-report:
    if: (github.event_name == 'schedule' && github.event.schedule == '40 0 * * *') || github.event.inputs.video == 'channel-report'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 00:00 UTC coincides with the English publish schedule's 0h slot
    # (2026-08-23 fixed-hour reschedule) — same concurrency group as the
    # publish jobs so they serialize instead of racing a push to main.
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull channel + video stats (Vietnamese)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: npm run channel-report -- --locale=vi

      # Separate Google account/channel — own refresh token, own report
      # file. Written to src/suckhoe/channel-report-en.md so the daily
      # content writer can lean into what's actually working for THAT
      # audience, not the Vietnamese one's numbers.
      - name: Pull channel + video stats (English)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
        run: npm run channel-report -- --locale=en

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/channel-report-vi.md src/suckhoe/channel-report-en.md
          git diff --staged --quiet || git commit -m "Update channel performance reports [skip ci]"
          git pull --rebase
          git push

  # Manual incident-response tool, dispatch-only — set specific existing
  # videos private/public/unlisted by ID. See scripts/set-video-privacy.mjs.
  set-video-privacy:
    if: github.event.inputs.video == 'set-video-privacy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set video privacy
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/set-video-privacy.mjs ${{ github.event.inputs.privacy_status }} ${{ github.event.inputs.video_ids }}

  # Experimental long-form (~20 min, landscape) format — a single
  # continuous story per episode, testing viewer interest ahead of
  # eventually building this out once the channel is YPP-eligible.
  # Manual/dispatch-only, not on any schedule — generates voiceover,
  # renders, and uploads (private by default) exactly one long-form
  # episode by slug. See src/suckhoe/long-form/.
  suckhoe-long:
    if: github.event.inputs.video == 'suckhoe-long' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Same group as the scheduled suckhoe-long-next picks — a manual
    # dispatch must serialize behind an in-flight cron render, otherwise
    # both upload the same episode (race seen 2026-11-05).
    concurrency:
      group: suckhoe-long-publish
    env:
      LONG_SLUG: ${{ github.event.inputs.long_form_slug || github.event.client_payload.slug }}
      PRIVACY_OVERRIDE: ${{ github.event.client_payload.privacy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # RESUME=1: when audio was committed with the episode (pre-generated
      # locally), the generator skips TTS entirely — the Edge TTS endpoint
      # 403s GitHub-runner IPs intermittently, so committed audio must not
      # still depend on a live TTS healthcheck.
      - name: Generate voiceover for this episode
        env:
          RESUME: "1"
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
        run: node scripts/generate-voiceover.mjs suckhoe-long-${{ env.LONG_SLUG }}

      # AI horror stills per scene — the REQUIRED visual layer (2026-11-14:
      # shipped a near-black video because the arc had scenePrompts but this
      # step was never wired into CI). Resumable; committed sceneImages make
      # it a no-op. Transient quota failures are tolerated — the coverage
      # gate below is what refuses a blind render.
      - name: Generate scene visuals
        continue-on-error: true
        run: node scripts/generate-story-visuals.mjs --long ${{ env.LONG_SLUG }}

      # Real motion b-roll per scene (Pixabay/Pexels -> archive.org). An
      # enhancement, not a blocker — scenes without a clip keep their
      # still-image Ken-Burns background.
      # System ffmpeg BEFORE footage fetch too — the Remotion-bundled
      # build cannot even open an mp4 for writing (transcode normalize
      # failed on every clip, 2026-11-14), and it has no drawtext for
      # the thumbnail either.
      - name: Install ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "apt ffmpeg attempt $i failed - retrying in 20s (transient mirror flakes killed a run on 2026-11-19)"
            sleep 20
          done
          exit 1

      - name: Fetch scene footage
        continue-on-error: true
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-scene-footage.mjs ${{ env.LONG_SLUG }}

      # HARD GATE: every beat must resolve an image or a clip — a missing
      # visual renders as the procedural dark background (= black video).
      - name: Visual coverage gate
        run: node scripts/verify-scene-visuals.mjs ${{ env.LONG_SLUG }}

      - name: Render episode
        run: node scripts/render-suckhoe-long.mjs ${{ env.LONG_SLUG }}

      # HARD GATE: sample the rendered mp4 — if every sampled frame is
      # black-level (YHIGH<25) the upload is refused. Catches cases where
      # the JSON looked covered but the render still produced darkness.
      - name: Post-render visual gate
        run: node scripts/verify-scene-visuals.mjs ${{ env.LONG_SLUG }} --post-render out/SucKhoeLong-${{ env.LONG_SLUG }}.mp4

      # Thumbnail is nice-to-have — a failure here must never skip the
      # upload (observed 2026-10-09: missing drawtext on the runner's
      # ffmpeg killed the step and the whole publish).
      - name: Make thumbnail
        continue-on-error: true
        run: node scripts/make-long-thumbnail.mjs ${{ env.LONG_SLUG }}

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-long-${{ env.LONG_SLUG }}
          path: out/SucKhoeLong-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to YouTube (private by default)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_LONG_PRIVACY_STATUS: ${{ env.PRIVACY_OVERRIDE || vars.YOUTUBE_LONG_PRIVACY_STATUS }}
        run: node scripts/upload-youtube-long.mjs ${{ env.LONG_SLUG }}

      - name: Build teaser Short for this episode
        if: success() && env.LONG_SLUG != ''
        continue-on-error: true
        run: node scripts/make-long-teaser.mjs ${{ env.LONG_SLUG }}

      - name: Upload teaser Short
        if: success() && env.LONG_SLUG != ''
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_TEASER_PRIVACY_STATUS: public
        run: node scripts/upload-long-teaser.mjs ${{ env.LONG_SLUG }}

      - name: Commit long-form ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sceneVideos points at gitignored public/videos/ paths — strip it
          # before committing the episode JSON so the repo never references
          # files that only existed in this runner.
          node -e "const fs=require('fs');const p='src/suckhoe/long-form/${{ env.LONG_SLUG }}.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.sceneVideos;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" || true
          git add src/suckhoe/published-long.json src/suckhoe/upload-blocked.json public/images/suckhoe-long/ src/suckhoe/long-form/${{ env.LONG_SLUG }}.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Record long-form upload ${{ env.LONG_SLUG }} [skip ci]"
          # Unstaged tracked edits (e.g. sceneVideos paths the footage
          # step writes into episode JSONs) make every `git rebase`
          # below refuse instantly - "cannot rebase: You have unstaged
          # changes" forever (killed tap-01 + tap-02 ledger commits).
          git checkout -- . || true
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              git push && exit 0
            fi
            node scripts/merge-long-ledger.mjs
            git add src/suckhoe/published-long.json
            # Non-ledger conflicts resolve to upstream — regenerated next run.
            git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
            git add -A
            if GIT_EDITOR=true git rebase --continue; then
              git push && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 20))
          done
          exit 1

  # Scheduled long-form publisher (owner directive 2026-10-09: 3-4
  # long videos/day). Runs the same pipeline as the suckhoe-long
  # dispatch job, but picks the slug itself via
  # scripts/next-long-form-slug.mjs and exits quietly when every
  # episode in src/suckhoe/long-form/ already has a ledger videoId.
  suckhoe-long-next:
    if: github.event_name == 'schedule' && (github.event.schedule == '30 22,6,12 * * *' || github.event.schedule == '30 2,9 * * 6,0' || github.event.schedule == '45 22 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: suckhoe-long-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pick next unpublished long-form episode
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Backup slot only: the 22:30 primary was either dropped or
          # fired — any render.yml run created since 21:45 UTC answers
          # which (delay is always <75min; only this cron lives in the
          # 21:45-23:45 window). A dropped slot yields an empty list.
          if [ "$SCHEDULE" = "45 22 * * *" ]; then
            SINCE=$(date -u -d 'today 21:45' +%FT%TZ)
            # gh run list --jq takes no --arg flags (its jq has no arg
            # injection) — pipe to real jq instead. The 2026-11-26 04:24
            # run died on this the first time the backup slot fired.
            OTHER=$(gh run list -w render.yml -L 15 --json createdAt,databaseId \
              | jq --arg s "$SINCE" --argjson me "$GITHUB_RUN_ID" \
                '[.[] | select(.databaseId != $me and .createdAt > $s)] | length')
            if [ "$OTHER" -gt 0 ]; then
              echo "Backup slot: primary 22:30 run fired - standing down."
              echo "slug=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Backup slot: no 22:30 run exists - acting as arc-start."
          fi
          SLUG=$(node scripts/next-long-form-slug.mjs)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUG" ]; then echo "No unpublished long-form episode left."; fi

      - name: Generate voiceover for this episode
        if: steps.pick.outputs.slug != ''
        env:
          RESUME: "1"
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
        run: node scripts/generate-voiceover.mjs suckhoe-long-${{ steps.pick.outputs.slug }}

      # AI horror stills per scene — REQUIRED visual layer (2026-11-14
      # incident: arc shipped with scenePrompts but no sceneImages and
      # published a black video). Resumable; committed sceneImages make it
      # a no-op. Coverage gate below enforces, not this step.
      - name: Generate scene visuals
        if: steps.pick.outputs.slug != ''
        continue-on-error: true
        run: node scripts/generate-story-visuals.mjs --long ${{ steps.pick.outputs.slug }}

      # System ffmpeg BEFORE footage fetch — bundled build cannot write
      # an mp4 at all (transcode normalize failed on every clip,
      # 2026-11-14) and lacks drawtext for the thumbnail.
      - name: Install ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "apt ffmpeg attempt $i failed - retrying in 20s (transient mirror flakes killed a run on 2026-11-19)"
            sleep 20
          done
          exit 1

      # Real motion b-roll per scene — enhancement only; stills fallback.
      - name: Fetch scene footage
        if: steps.pick.outputs.slug != ''
        continue-on-error: true
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/fetch-scene-footage.mjs ${{ steps.pick.outputs.slug }}

      # HARD GATE: refuse to render when any beat has no visual at all —
      # a missing visual becomes the procedural dark background.
      - name: Visual coverage gate
        if: steps.pick.outputs.slug != ''
        run: node scripts/verify-scene-visuals.mjs ${{ steps.pick.outputs.slug }}

      - name: Render episode
        if: steps.pick.outputs.slug != ''
        run: node scripts/render-suckhoe-long.mjs ${{ steps.pick.outputs.slug }}

      # HARD GATE: refuse upload when sampled frames are all black-level.
      - name: Post-render visual gate
        if: steps.pick.outputs.slug != ''
        run: node scripts/verify-scene-visuals.mjs ${{ steps.pick.outputs.slug }} --post-render out/SucKhoeLong-${{ steps.pick.outputs.slug }}.mp4

      # Thumbnail is nice-to-have — never blocks the upload.
      - name: Make thumbnail
        if: steps.pick.outputs.slug != ''
        continue-on-error: true
        run: node scripts/make-long-thumbnail.mjs ${{ steps.pick.outputs.slug }}

      - name: Upload video artifact
        if: always() && steps.pick.outputs.slug != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-long-${{ steps.pick.outputs.slug }}
          path: out/SucKhoeLong-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to YouTube
        if: steps.pick.outputs.slug != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          # Scheduled runs publish straight to public — private-by-default
          # only makes sense for manual dispatch reviews.
          YOUTUBE_LONG_PRIVACY_STATUS: public
        run: node scripts/upload-youtube-long.mjs ${{ steps.pick.outputs.slug }}

      # 1-long-1-short rhythm (owner directive 2026-11-04): every
      # published episode gets its teaser Short immediately, alternating
      # long/short on the channel instead of batching teasers at night.
      # ffmpeg already installed above (thumbnail step needs it too).

      - name: Build teaser Short for this episode
        if: success() && steps.pick.outputs.slug != ''
        continue-on-error: true # teaser is bonus on top of the long-form
        # upload — a build hiccup must never red the run; the watchdog
        # pairs-check + retries missing teasers
        run: node scripts/make-long-teaser.mjs ${{ steps.pick.outputs.slug }}

      - name: Upload teaser Short
        if: success() && steps.pick.outputs.slug != ''
        continue-on-error: true # long-form already landed; a teaser
        # hiccup must never red the run (watchdog retries it anyway)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_TEASER_PRIVACY_STATUS: public
        run: node scripts/upload-long-teaser.mjs ${{ steps.pick.outputs.slug }}

      - name: Commit long-form ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sceneVideos references gitignored public/videos/ paths — strip
          # before committing the episode JSON.
          node -e "const fs=require('fs');const p='src/suckhoe/long-form/${{ steps.pick.outputs.slug }}.json';if(fs.existsSync(p)){const j=JSON.parse(fs.readFileSync(p,'utf8'));delete j.sceneVideos;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" || true
          git add src/suckhoe/published-long.json src/suckhoe/upload-blocked.json public/images/suckhoe-long/ src/suckhoe/long-form/${{ steps.pick.outputs.slug }}.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Record long-form upload ${{ steps.pick.outputs.slug }} [skip ci]"
          git checkout -- . || true
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              git push && exit 0
            fi
            node scripts/merge-long-ledger.mjs
            git add src/suckhoe/published-long.json
            # Non-ledger conflicts resolve to upstream — regenerated next run.
            git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
            git add -A
            if GIT_EDITOR=true git rebase --continue; then
              git push && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 20))
          done
          exit 1

  # Teaser-ahead: publishes the teaser Short of an unpublished episode
  # before its long lands, so the Shorts feed (the channel's growth
  # engine) keeps producing even when the long queue is backed up.
  # Pure-ffmpeg teaser build + upload only — under a minute of compute.
  suckhoe-teaser-ahead:
    if: (github.event_name == 'schedule' && (github.event.schedule == '30 3,9,15 * * *' || github.event.schedule == '30 0,7 * * 6,0')) || github.event.inputs.video == 'suckhoe-teaser-ahead'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: suckhoe-teaser-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "apt ffmpeg attempt $i failed - retrying in 20s (transient mirror flakes killed a run on 2026-11-19)"
            sleep 20
          done
          exit 1

      - name: Pick next episode missing its teaser Short
        id: pick
        run: |
          OUT=$(node scripts/next-teaser-ahead-slug.mjs)
          SLUG=$(echo "$OUT" | grep -o 'slug=[^ ]*' | cut -d= -f2)
          VARIANT=$(echo "$OUT" | grep -o 'variant=[^ ]*' | cut -d= -f2)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "variant=${VARIANT:-1}" >> "$GITHUB_OUTPUT"
          echo "$OUT"
          if [ -z "$SLUG" ]; then echo "Every episode has both teaser Shorts."; fi

      - name: Build teaser Short
        if: steps.pick.outputs.slug != ''
        run: node scripts/make-long-teaser.mjs ${{ steps.pick.outputs.slug }} ${{ steps.pick.outputs.variant }}

      - name: Upload teaser Short
        if: steps.pick.outputs.slug != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_TEASER_PRIVACY_STATUS: public
        run: node scripts/upload-long-teaser.mjs ${{ steps.pick.outputs.slug }} ${{ steps.pick.outputs.variant }}

      - name: Commit teaser ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/published-long.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Record teaser-ahead upload ${{ steps.pick.outputs.slug }} [skip ci]"
          git checkout -- . || true
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              git push && exit 0
            fi
            node scripts/merge-long-ledger.mjs
            git add src/suckhoe/published-long.json
            git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
            git add -A
            if GIT_EDITOR=true git rebase --continue; then
              git push && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 20))
          done
          exit 1

  # Daily watchdog + self-heal — scripts/pipeline-doctor.mjs. Catches
  # the failures that look green from the outside: videos uploaded but
  # never ledgered (rebase-race loss), ledgered videos that later
  # vanished, published episodes missing their discovery teaser, and a
  # drained story queue. Fixes what it can, reports the rest to
  # src/suckhoe/pipeline-doctor.md.
  pipeline-doctor:
    if: (github.event_name == 'schedule' && github.event.schedule == '45 16 * * *') || github.event.inputs.video == 'pipeline-doctor'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: suckhoe-long-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Remotion-bundled compositor ffmpeg is built with
      # --disable-filters (no boxblur/overlay/zoompan/drawtext/afade) —
      # teaser builds need the full-featured Ubuntu binary.
      - name: Install ffmpeg
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "apt ffmpeg attempt $i failed - retrying in 20s (transient mirror flakes killed a run on 2026-11-19)"
            sleep 20
          done
          exit 1

      - name: Run pipeline doctor
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_TEASER_PRIVACY_STATUS: public
          # 3 teasers/run — backfills the backlog over a few days without
          # pushing the channel near the daily upload cap.
          # Bumped to 5 while Shorts distribution is hot (Nov-2026 data:
          # recent teasers landing 100-400+ views vs 0-2 before).
          DOCTOR_MAX_TEASERS: "5"
        run: node scripts/pipeline-doctor.mjs

      # Every teaser built this run + a paste-ready caption/link sheet.
      - name: Upload teaser posting pack
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: teaser-posting-pack
          path: |
            out/teaser-*.mp4
            out/teaser-posting-sheet.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit doctor report + ledger fixes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/pipeline-doctor.md src/suckhoe/published-long.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Pipeline doctor report + ledger reconciliation [skip ci]"
          git checkout -- . || true
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              git push && exit 0
            fi
            node scripts/merge-long-ledger.mjs
            git add src/suckhoe/published-long.json
            # Non-ledger conflicts (reports, maps) — upstream wins; the
            # next doctor run regenerates our side. Killed run
            # 43640116591: loop died applying over pending-delete.json.
            git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
            git add -A
            if GIT_EDITOR=true git rebase --continue; then
              git push && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 20))
          done
          # Same fail-loud rule as the watchdog: reconciliation that
          # never reaches origin is work that never happened.
          exit 1

  pipeline-watchdog:
    if: (github.event_name == 'schedule' && github.event.schedule == '13 */3 * * *') || github.event.inputs.video == 'pipeline-watchdog'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # required to rerun failed jobs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan failures and auto-remediate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/pipeline-watchdog.mjs

      # Drain the targeted deletion queue FIRST — every later step spends
      # API quota; no point repairing metadata on a video slated for
      # deletion (2026-11-14: black-render tap-02 pair sat live because the
      # local quota window was exhausted and no mechanism existed to remove
      # it automatically).
      - name: Drain pending deletions
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/drain-deletes.mjs

      - name: Refill story queue when below 10 episodes
        continue-on-error: true
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          # Keep ~2 arcs in reserve so the teaser-ahead pool never runs
          # dry between arcs — the 2026-11-24/25 Shorts gap happened
          # because every unpublished episode already had a live teaser.
          MIN_QUEUE: "10"
        run: |
          set -e
          if [ -n "${CODEX_API_KEY:-}" ]; then
            # Gateway accepts coding clients only (Codex CLI), so write a
            # minimal config and drive the refill through `codex exec`
            # instead of raw API calls (chat/completions is disabled).
            npm install -g @openai/codex@0.163.0 --silent
            mkdir -p "$HOME/.codex"
            printf 'model_provider = "OpenAI"\nmodel = "gpt-6.1-sol"\n\n[model_providers.OpenAI]\nbase_url = "https://api.xingchiapi.com/v1"\nwire_api = "responses"\nrequires_openai_auth = false\nexperimental_bearer_token = "%s"\n' "$CODEX_API_KEY" > "$HOME/.codex/config.toml"
            node scripts/queue-refill.mjs --write --agent codex
          else
            node scripts/queue-refill.mjs --write
          fi

      - name: Top up missing beat audio for unpublished episodes
        continue-on-error: true
        if: always()
        env:
          RESUME: "1"
          GCP_TTS_API_KEY: ${{ secrets.GCP_TTS_API_KEY }}
        run: node scripts/audio-topup.mjs

      # Dedicated scary thumbnail stills for any episode missing one —
      # gen-thumb-visuals skips episodes that already have thumb.jpg,
      # so each run only pays for genuinely new arcs (it was never
      # wired anywhere before 2026-11-13; every new arc fell back to a
      # generic scenery still).
      - name: Generate missing scary thumbnail stills
        continue-on-error: true
        if: always()
        run: node scripts/gen-thumb-visuals.mjs

      - name: Sync per-series playlists (Shorts -> long-form funnel)
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/series-playlist-sync.mjs

      - name: Repair damaged live teaser titles
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/fix-teaser-titles.mjs

      # System ffmpeg for thumbnail repair — the bundled Remotion build
      # has no drawtext, so pending-thumbnail rebuilds here would emit
      # plain frames without it.
      - name: Install ffmpeg
        if: always()
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && exit 0
            echo "apt ffmpeg attempt $i failed - retrying in 20s (transient mirror flakes killed a run on 2026-11-19)"
            sleep 20
          done
          exit 1

      - name: Sync regenerated thumbnails to live videos
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/fix-thumbnails.mjs

      - name: Pin comments on videos missing them
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/pin-teaser-comments.mjs

      # Post-upload quality gate — 2026-11-14 shipped 3 green-CI videos
      # with dead links, junk tags and missing custom thumbnails because
      # nothing verified live metadata. Repaired in place where safe.
      - name: Verify live upload quality
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/verify-live-quality.mjs

      - name: Delete duplicate uploads not in the ledger
        continue-on-error: true
        if: always()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          DEDUPE_DEBUG: "1"
        run: node scripts/dedupe-channel-videos.mjs --apply

      - name: Commit watchdog report and refilled content
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --ignore-errors: a pathspec that matched nothing aborts the
          # whole add (observed 2026-11-13: series-playlists.json absent
          # -> topped-up audio never staged -> rebase loop died silent).
          git add --ignore-errors src/suckhoe/pipeline-watchdog.md src/suckhoe/upload-blocked.json src/suckhoe/quarantine.json src/suckhoe/long-form/ src/suckhoe/series-playlists.json src/suckhoe/thumb-sync.json src/suckhoe/published-long.json src/suckhoe/published.json src/suckhoe/pending-delete.json public/audio/suckhoe-long/ public/images/suckhoe-long/ public/captions/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Pipeline watchdog report + queue refill [skip ci]"
          git checkout -- . || true
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            if git rebase origin/main; then
              git push && exit 0
            fi
            node scripts/merge-long-ledger.mjs 2>/dev/null || true
            git add src/suckhoe/published-long.json 2>/dev/null || true
            # Non-ledger conflicts resolve to upstream — regenerated next run.
            git diff --name-only --diff-filter=U -z | xargs -0 -r git checkout --ours -- 2>/dev/null || true
            git add -A
            if GIT_EDITOR=true git rebase --continue; then
              git push && exit 0
            fi
            git rebase --abort || true
            sleep $((i * 20))
          done
          # Topped-up audio, playlist map, reports - all die on the
          # runner if push never lands. exit 0 here was THE root cause
          # behind the 2026-11-13 silent stall: every 3h the watchdog
          # produced the fix and then lost it while staying green.
          exit 1

  # Weekly self-evaluation (Sunday 20:00 VN): ranks arcs by real
  # per-video stats, writes strategy directives that steer the next
  # auto-written arc (queue-refill reads strategy-directives.json).
  # Human report lands in src/suckhoe/channel-review.md.
  channel-review:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 0') || github.event.inputs.video == 'channel-review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Weekly channel review
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/channel-review-weekly.mjs

      # Mine OUR channel's comments for episode ideas — the script
      # existed for weeks unwired; audience questions are the cheapest
      # pre-validated content signal available.
      - name: Mine audience comments for episode ideas
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
        run: node scripts/comments-to-content.mjs --locale=vi

      - name: Commit review + directives
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/channel-review.md src/suckhoe/strategy-directives.json src/suckhoe/weekly-review/ src/suckhoe/comment-ideas.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Weekly channel review + strategy directives [skip ci]"
          git pull --rebase
          git push
