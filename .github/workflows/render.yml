name: Render TikTok video

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "out/**"
      - "README.md"

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover

      - name: Render video
        run: npm run render

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-videos
          path: |
            out/GiaCatLuong-TuVi.mp4
            out/Churchill-GiaoTiep.mp4
          retention-days: 30
