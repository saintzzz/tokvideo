name: Render TikTok video

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Which video to render (leave as auto on push to only render what changed). Pick 'set-video-privacy' to use the fields below instead."
        type: choice
        options: [auto, all, gia-cat-luong, churchill, hippocrates, ideverray, ammuu, suckhoe, suckhoe-publish-next, suckhoe-en-publish-next, channel-report, set-video-privacy, release-shelved-suckhoe, suckhoe-long, english-arena]
        default: auto
      privacy_status:
        description: "set-video-privacy only: private, public, or unlisted"
        type: choice
        options: [private, public, unlisted]
        default: private
      video_ids:
        description: "set-video-privacy only: space-separated YouTube video IDs"
        type: string
        default: ""
      long_form_slug:
        description: "suckhoe-long only: which long-form episode slug to generate/render/upload (any slug in src/suckhoe/long-form/)"
        type: string
        default: "kiem-hon-thuc-tinh-tap-01"
  push:
    branches: [main]
    paths-ignore:
      - "out/**"
      - "README.md"
  schedule:
    # Cut from 7/day to 3/day (2026-08-25) — channel-report.mjs showed
    # both Suc Khoe channels' views collapsing to near-zero starting
    # 2026-08-23, the exact day this went from an evenly-spread 6/day to
    # 7/day *clustered into back-to-back hours* (03,04 / 08,09 /
    # 14,15,16 UTC — three uploads within a single 2h window). Landing
    # multiple Shorts within an hour or two of each other from the same
    # channel is a well-known trigger for YouTube's spam/reduced-
    # distribution classifier, on top of this channel already having
    # one prior mass-upload incident (2026-08-22, see the shelved-video
    # trigger below). The peak-hour targeting intent is kept, but now
    # one upload per peak window instead of two, and every slot is at
    # least 5h from the next: 10h, 16h, 22h Vietnam time (UTC+7, no DST)
    # = 03, 09, 15 UTC.
    - cron: "0 3,9,15 * * *"
    # Same fix for the English-market channel — was also 7/day clustered
    # (00,01 / 12,13 / 17,18 / 23 UTC) and showed the identical
    # views-collapse pattern from 2026-08-23. Now one upload per peak
    # window, each slot >=5h from the next: 8h, 14h, 20h ET = 12, 18, 0
    # UTC (EDT, UTC-4; shifts 1h during EST, Nov-Mar).
    - cron: "0 0,12,18 * * *"
    # Once daily — pulls real channel/video stats (subscribers, views,
    # watch time, per-video performance) into the job log via
    # scripts/channel-report.mjs, so cadence/content decisions have actual
    # data behind them instead of guesswork. No-ops harmlessly until the
    # YOUTUBE_* secrets carry a token with the readonly/analytics scopes
    # (see scripts/youtube-get-refresh-token.mjs).
    #
    # Minute offset :40 (2026-08-27) for the same reason as the
    # release-shelved cron above — this shares the 0h slot with the EN
    # publish cron and landing on the exact same minute made a stale-
    # checkout push race more likely.
    - cron: "40 0 * * *"
    # Long-form story publishing, 4x/day (owner directive 2026-10-09:
    # "video dài 3-4 video/ngày"). Each tick runs the full pipeline for
    # the next unpublished episode in src/suckhoe/long-form/ — voiceover,
    # render, thumbnail, upload, ledger commit — picking the slug via
    # scripts/next-long-form-slug.mjs and no-opping when the queue is
    # drained. Hours spread to stay clear of both Shorts crons and each
    # other: 4h, 10h, 16h, 22h Vietnam (21, 3, 9, 15 UTC). :30 offsets
    # avoid exact-minute collisions with the other crons' checkouts.
    - cron: "30 21,3,9,15 * * *"
    # Three times daily — releases exactly one shelved (privated) video
    # back to public, so the 7 legitimate episodes caught by the
    # 2026-08-22 mass-upload incident get out to the audience gradually
    # instead of staying privately shelved forever, without dumping them
    # all back to public at once and recreating the exact same problem.
    # No-ops harmlessly once src/suckhoe/shelved-videos.json is empty —
    # never remove this trigger expecting it to matter only temporarily,
    # it's a permanent safety valve for any future batch that needs it.
    #
    # Minute offset :20 (2026-08-27), not :00 — this shares the 18h slot
    # with the EN publish cron below, and even though both are in the
    # same suckhoe-publish-queue concurrency group, landing on the exact
    # same minute meant this job's checkout could occasionally beat the
    # replication of the other job's just-landed commit by a couple
    # seconds, rejecting this job's own (usually no-op) push — confirmed
    # from two real job failures 2026-08-25/26. Fixed at the root with
    # `git pull --rebase` before every push in this concurrency group
    # (see each job's commit step); the offset is extra insurance to cut
    # how often they queue back to back at all.
    - cron: "20 2,10,18 * * *"

jobs:
  detect-changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    outputs:
      gia_cat_luong: ${{ steps.decide.outputs.gia_cat_luong }}
      churchill: ${{ steps.decide.outputs.churchill }}
      hippocrates: ${{ steps.decide.outputs.hippocrates }}
      ideverray: ${{ steps.decide.outputs.ideverray }}
      ammuu: ${{ steps.decide.outputs.ammuu }}
      suckhoe: ${{ steps.decide.outputs.suckhoe }}
      suckhoe_shared: ${{ steps.decide.outputs.suckhoe_shared }}
      suckhoe_episode_files: ${{ steps.filter.outputs.suckhoe_episodes_files }}
      english_arena: ${{ steps.decide.outputs.english_arena }}
      english_arena_shared: ${{ steps.decide.outputs.english_arena_shared }}
      english_arena_episode_files: ${{ steps.filter.outputs.english_arena_episodes_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          filters: |
            shared:
              - 'src/components/**'
              - 'src/fonts.ts'
              - 'src/timing.ts'
              - 'src/composition-utils.ts'
              - 'scripts/generate-voiceover.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'remotion.config.ts'
            gia_cat_luong:
              - 'src/GiaCatLuongVideo.tsx'
              - 'src/Composition.tsx'
              - 'src/scenes/**'
              - 'src/narration.json'
            churchill:
              - 'src/ChurchillVideo.tsx'
              - 'src/ChurchillComposition.tsx'
              - 'src/scenes-churchill/**'
              - 'src/narration.churchill.json'
            hippocrates:
              - 'src/HippocratesVideo.tsx'
              - 'src/HippocratesComposition.tsx'
              - 'src/scenes-hippocrates/**'
              - 'src/narration.hippocrates.json'
            ideverray:
              - 'src/IdeverrayVideo.tsx'
              - 'src/IdeverrayComposition.tsx'
              - 'src/scenes-ideverray/**'
              - 'src/narration.ideverray.json'
              - 'public/images/ideverray/**'
            ammuu:
              - 'src/AmMuuVideo.tsx'
              - 'src/AmMuuComposition.tsx'
              - 'src/scenes-ammuu/**'
              - 'src/narration.ammuu.json'
              - 'public/images/ammuu/**'
            # Split in two so a push that only adds/edits episode JSON files
            # (the common case — daily-writer commits, manually adding an
            # episode) renders ONLY those episodes, not the whole back
            # catalog. A change to shared suckhoe code (scenes, the render
            # script, the episode type) affects every suckhoe video's
            # output, so that still triggers a full re-render — correctly.
            # (src/components/** is covered by the top-level "shared" filter
            # above, which already forces a full render of all 6 videos.)
            suckhoe_shared:
              - 'src/SucKhoeVideo.tsx'
              - 'src/SucKhoeComposition.tsx'
              - 'src/scenes-suckhoe/**'
              - 'scripts/render-suckhoe.mjs'
              - 'src/suckhoe/types.ts'
            suckhoe_episodes:
              - 'src/suckhoe/episodes/*.json'
            # English Arena marketing ads — same shared/episode split as
            # suckhoe. A shared-file change re-renders every ad; an
            # episode-only push renders just that ad. The episodes index
            # (src/english-arena/episodes/index.ts) is deliberately left
            # out — it always accompanies a new episode .json anyway.
            english_arena_shared:
              - 'src/EnglishArenaVideo.tsx'
              - 'src/EnglishArenaComposition.tsx'
              - 'src/scenes-ea/**'
              - 'scripts/render-english-arena.mjs'
              - 'src/english-arena/types.ts'
              - 'public/images/english-arena/**'
            english_arena_episodes:
              - 'src/english-arena/episodes/*.json'

      # On push: render only videos touched by this change (or every video
      # if a shared file changed). On a manual run: render everything unless
      # a specific video was picked from the dropdown.
      - name: Decide which videos to render
        id: decide
        env:
          VIDEO_INPUT: ${{ github.event.inputs.video }}
          EVENT_NAME: ${{ github.event_name }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          GIA_CAT_LUONG_CHANGED: ${{ steps.filter.outputs.gia_cat_luong }}
          CHURCHILL_CHANGED: ${{ steps.filter.outputs.churchill }}
          HIPPOCRATES_CHANGED: ${{ steps.filter.outputs.hippocrates }}
          IDEVERRAY_CHANGED: ${{ steps.filter.outputs.ideverray }}
          AMMUU_CHANGED: ${{ steps.filter.outputs.ammuu }}
          SUCKHOE_SHARED_CHANGED: ${{ steps.filter.outputs.suckhoe_shared }}
          SUCKHOE_EPISODES_CHANGED: ${{ steps.filter.outputs.suckhoe_episodes }}
          ENGLISH_ARENA_SHARED_CHANGED: ${{ steps.filter.outputs.english_arena_shared }}
          ENGLISH_ARENA_EPISODES_CHANGED: ${{ steps.filter.outputs.english_arena_episodes }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # The scheduled tick only drives publish-next-suckhoe (its own
            # job, gated on event_name == 'schedule' directly) — none of
            # the push/manual-dispatch render jobs should fire here.
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && { [ -z "$VIDEO_INPUT" ] || [ "$VIDEO_INPUT" = "auto" ]; }; then
            if [ "$SHARED_CHANGED" = "true" ] || [ "$GIA_CAT_LUONG_CHANGED" = "true" ]; then
              echo "gia_cat_luong=true" >> "$GITHUB_OUTPUT"
            else
              echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$CHURCHILL_CHANGED" = "true" ]; then
              echo "churchill=true" >> "$GITHUB_OUTPUT"
            else
              echo "churchill=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$HIPPOCRATES_CHANGED" = "true" ]; then
              echo "hippocrates=true" >> "$GITHUB_OUTPUT"
            else
              echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$IDEVERRAY_CHANGED" = "true" ]; then
              echo "ideverray=true" >> "$GITHUB_OUTPUT"
            else
              echo "ideverray=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$AMMUU_CHANGED" = "true" ]; then
              echo "ammuu=true" >> "$GITHUB_OUTPUT"
            else
              echo "ammuu=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$SUCKHOE_SHARED_CHANGED" = "true" ] || [ "$SUCKHOE_EPISODES_CHANGED" = "true" ]; then
              echo "suckhoe=true" >> "$GITHUB_OUTPUT"
            else
              echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$SUCKHOE_SHARED_CHANGED" = "true" ]; then
              echo "suckhoe_shared=true" >> "$GITHUB_OUTPUT"
            else
              echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$VIDEO_INPUT" = "gia-cat-luong" ]; then
            echo "gia_cat_luong=true" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "churchill" ]; then
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=true" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "hippocrates" ]; then
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=true" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "ideverray" ]; then
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=true" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "ammuu" ]; then
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=true" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "suckhoe" ]; then
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=true" >> "$GITHUB_OUTPUT"
            # Manual "render all suckhoe" dispatch — deliberately full,
            # not diffed.
            echo "suckhoe_shared=true" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_INPUT" = "suckhoe-publish-next" ] || [ "$VIDEO_INPUT" = "suckhoe-en-publish-next" ] || [ "$VIDEO_INPUT" = "channel-report" ] || [ "$VIDEO_INPUT" = "set-video-privacy" ] || [ "$VIDEO_INPUT" = "release-shelved-suckhoe" ] || [ "$VIDEO_INPUT" = "suckhoe-long" ]; then
            # These are each gated directly on their own input value in
            # their own job — none of the render-* jobs should run. A
            # missing branch here previously fell through to the
            # all-true `else` below, which is exactly the class of bug
            # that caused the 2026-08-22 mass-upload incident elsewhere
            # in this file — do not let a new dispatch choice go
            # unhandled here again.
            echo "gia_cat_luong=false" >> "$GITHUB_OUTPUT"
            echo "churchill=false" >> "$GITHUB_OUTPUT"
            echo "hippocrates=false" >> "$GITHUB_OUTPUT"
            echo "ideverray=false" >> "$GITHUB_OUTPUT"
            echo "ammuu=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe=false" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=false" >> "$GITHUB_OUTPUT"
          else
            echo "gia_cat_luong=true" >> "$GITHUB_OUTPUT"
            echo "churchill=true" >> "$GITHUB_OUTPUT"
            echo "hippocrates=true" >> "$GITHUB_OUTPUT"
            echo "ideverray=true" >> "$GITHUB_OUTPUT"
            echo "ammuu=true" >> "$GITHUB_OUTPUT"
            echo "suckhoe=true" >> "$GITHUB_OUTPUT"
            echo "suckhoe_shared=true" >> "$GITHUB_OUTPUT"
          fi

          # English Arena ads are decided separately so the giant chain
          # above doesn't grow 2 echoes per branch. Renders on: push
          # touching its files, manual "english-arena" or "all" dispatch.
          # Any other manual pick (suckhoe, gia-cat-luong, ...) leaves it
          # off — the picker asked for one specific thing.
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "english_arena=false" >> "$GITHUB_OUTPUT"
            echo "english_arena_shared=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ] && { [ -z "$VIDEO_INPUT" ] || [ "$VIDEO_INPUT" = "auto" ]; }; then
            if [ "$SHARED_CHANGED" = "true" ] || [ "$ENGLISH_ARENA_SHARED_CHANGED" = "true" ] || [ "$ENGLISH_ARENA_EPISODES_CHANGED" = "true" ]; then
              echo "english_arena=true" >> "$GITHUB_OUTPUT"
            else
              echo "english_arena=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$SHARED_CHANGED" = "true" ] || [ "$ENGLISH_ARENA_SHARED_CHANGED" = "true" ]; then
              echo "english_arena_shared=true" >> "$GITHUB_OUTPUT"
            else
              echo "english_arena_shared=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$VIDEO_INPUT" = "english-arena" ] || [ "$VIDEO_INPUT" = "all" ]; then
            echo "english_arena=true" >> "$GITHUB_OUTPUT"
            echo "english_arena_shared=true" >> "$GITHUB_OUTPUT"
          else
            echo "english_arena=false" >> "$GITHUB_OUTPUT"
            echo "english_arena_shared=false" >> "$GITHUB_OUTPUT"
          fi

  render-gia-cat-luong:
    needs: detect-changes
    if: needs.detect-changes.outputs.gia_cat_luong == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover:gia-cat-luong

      - name: Render video
        run: npm run render:gia-cat-luong

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: gia-cat-luong-tu-vi
          path: out/GiaCatLuong-TuVi.mp4
          retention-days: 7

  render-churchill:
    needs: detect-changes
    if: needs.detect-changes.outputs.churchill == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover:churchill

      - name: Render video
        run: npm run render:churchill

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: churchill-giao-tiep
          path: out/Churchill-GiaoTiep.mp4
          retention-days: 7

  render-hippocrates:
    needs: detect-changes
    if: needs.detect-changes.outputs.hippocrates == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover:hippocrates

      - name: Render video
        run: npm run render:hippocrates

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: hippocrates-dinh-duong
          path: out/Hippocrates-DinhDuong.mp4
          retention-days: 7

  render-ideverray:
    needs: detect-changes
    if: needs.detect-changes.outputs.ideverray == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover:ideverray

      - name: Render video
        run: npm run render:ideverray

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ideverray-ao-doi
          path: out/Ideverray-AoDoi.mp4
          retention-days: 7

  render-ammuu:
    needs: detect-changes
    if: needs.detect-changes.outputs.ammuu == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover (free Edge neural TTS, no API key)
        run: npm run generate-voiceover:ammuu

      - name: Render video
        run: npm run render:ammuu

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ammuu-chien-luoc
          path: out/AmMuu-ChienLuoc.mp4
          retention-days: 7

  render-suckhoe:
    needs: detect-changes
    if: needs.detect-changes.outputs.suckhoe == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Renders only the episode(s) that actually changed in this push
      # when possible, instead of the whole back catalog — a plain
      # daily-writer commit adding a couple of episodes used to trigger a
      # full re-render of all 27+ episodes every time, which is what made
      # the 2026-08-22 incident's review job take 29+ minutes (and hang).
      # Falls back to rendering everything when a shared suckhoe file
      # changed (scenes, render script, episode type) — that legitimately
      # affects every episode's output — or on a manual "suckhoe" dispatch.
      - name: Determine which episodes changed
        id: targets
        env:
          SUCKHOE_SHARED: ${{ needs.detect-changes.outputs.suckhoe_shared }}
          EPISODE_FILES: ${{ needs.detect-changes.outputs.suckhoe_episode_files }}
        run: |
          if [ "$SUCKHOE_SHARED" = "true" ] || [ -z "$EPISODE_FILES" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Rendering every episode (shared suckhoe file changed, or no specific episode file list available)."
          else
            slugs=""
            ids=""
            for f in $EPISODE_FILES; do
              # Skip files that no longer exist (e.g. a deleted/renamed
              # episode) — nothing to render for those, and passing a slug
              # with no matching file would just error out downstream.
              if [ -f "$f" ]; then
                slug=$(basename "$f" .json)
                slugs="$slugs $slug"
                ids="$ids suckhoe-$slug"
              fi
            done
            if [ -z "$slugs" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "All changed episode files were deletions — nothing to render."
            else
              echo "mode=partial" >> "$GITHUB_OUTPUT"
              echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
              echo "ids=$ids" >> "$GITHUB_OUTPUT"
              echo "Rendering only the changed episode(s): $slugs"
            fi
          fi

      - name: Generate voiceover for the affected episode(s) (free Edge neural TTS, no API key)
        if: steps.targets.outputs.mode != 'none'
        run: |
          if [ "${{ steps.targets.outputs.mode }}" = "all" ]; then
            npm run generate-voiceover:suckhoe
          else
            node scripts/generate-voiceover.mjs ${{ steps.targets.outputs.ids }}
          fi

      - name: Render the affected episode(s)
        if: steps.targets.outputs.mode != 'none'
        run: |
          if [ "${{ steps.targets.outputs.mode }}" = "all" ]; then
            npm run render:suckhoe
          else
            node scripts/render-suckhoe.mjs ${{ steps.targets.outputs.slugs }}
          fi

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-episodes
          path: out/SucKhoe-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      # Deliberately does NOT upload to YouTube. This job renders every
      # episode for review on ANY push touching src/suckhoe/** — including
      # every automated daily-content-writer commit. It used to also run
      # `upload-youtube:suckhoe` (uploads ALL episodes unconditionally, no
      # check against published.json) here, which meant every new-episode
      # push re-uploaded the entire back catalog as new public videos. That
      # fired for real on 2026-08-22: 9 episodes went public within ~30s,
      # stopped only by YouTube's own daily upload-quota limit. The ONLY
      # path that is allowed to upload to YouTube is publish-next-suckhoe
      # below — it's queue-gated (checks published.json) and rate-limited
      # to one episode per schedule tick. Do not re-add an upload step here.

  # English Arena marketing ads (src/english-arena/episodes/) — vertical
  # pain-point -> product-proof -> CTA videos for the ea.vieschool.com
  # online funnel. Same changed-episode targeting as render-suckhoe.
  # Deliberately NO YouTube upload: these are sales assets the owner
  # posts to FB/Zalo/TikTok/ads manually after review, not channel
  # content — an auto-upload here would put product ads on the story
  # channel and repeat the exact mass-publish signature that killed it.
  render-english-arena:
    needs: detect-changes
    if: needs.detect-changes.outputs.english_arena == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine which episodes changed
        id: targets
        env:
          EA_SHARED: ${{ needs.detect-changes.outputs.english_arena_shared }}
          EPISODE_FILES: ${{ needs.detect-changes.outputs.english_arena_episode_files }}
        run: |
          if [ "$EA_SHARED" = "true" ] || [ -z "$EPISODE_FILES" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "Rendering every English Arena ad (shared file changed, or no specific episode file list available)."
          else
            slugs=""
            ids=""
            for f in $EPISODE_FILES; do
              if [ -f "$f" ]; then
                slug=$(basename "$f" .json)
                slugs="$slugs $slug"
                ids="$ids ea-$slug"
              fi
            done
            if [ -z "$slugs" ]; then
              echo "mode=none" >> "$GITHUB_OUTPUT"
              echo "All changed episode files were deletions — nothing to render."
            else
              echo "mode=partial" >> "$GITHUB_OUTPUT"
              echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
              echo "ids=$ids" >> "$GITHUB_OUTPUT"
              echo "Rendering only the changed ad(s): $slugs"
            fi
          fi

      - name: Generate voiceover for the affected ad(s) (free Edge neural TTS, no API key)
        if: steps.targets.outputs.mode != 'none'
        run: |
          if [ "${{ steps.targets.outputs.mode }}" = "all" ]; then
            npm run generate-voiceover:ea
          else
            node scripts/generate-voiceover.mjs ${{ steps.targets.outputs.ids }}
          fi

      - name: Render the affected ad(s)
        if: steps.targets.outputs.mode != 'none'
        run: |
          if [ "${{ steps.targets.outputs.mode }}" = "all" ]; then
            npm run render:ea
          else
            node scripts/render-english-arena.mjs ${{ steps.targets.outputs.slugs }}
          fi

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: english-arena-ads
          path: out/EnglishArena-*.mp4
          retention-days: 30
          if-no-files-found: ignore

  # Every 4 hours (see the schedule trigger above): publish exactly the
  # next un-published episode and commit the updated queue state back to
  # the repo. Separate from render-suckhoe, which is push/manual-triggered
  # and re-renders every episode for review — this one advances the queue
  # by exactly one. github.event.schedule carries which cron fired, so this
  # only reacts to its own schedule now that channel-report shares the
  # 'schedule' event too.
  publish-next-suckhoe:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3,9,15 * * *') || github.event.inputs.video == 'suckhoe-publish-next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with publish-next-suckhoe-en and release-shelved-suckhoe: all
    # three commit+push src/suckhoe/*.json, and their fixed-hour schedules
    # don't overlap each other by design (2026-08-23) but channel-report's
    # 00:00 UTC daily run still can — same concurrency group serializes
    # them instead of racing two separate checkouts on the same push.
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish next queued episode
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: npm run publish-next:suckhoe

      # continue-on-error (2026-09-15 incident): this repo hit its GitHub
      # Actions artifact storage quota, and this step's failure was
      # silently blocking the "Commit updated publish queue" step below
      # it - the YouTube upload above had already succeeded, but with
      # the job stopped here, published.json never got updated, so the
      # NEXT run picked the exact same "next" episode again. That looped
      # for 10 days and produced 49 duplicate public uploads of one
      # episode before anyone noticed. This artifact is a debugging
      # convenience, not something that should ever be able to block
      # real pipeline state - never let it become a hard failure again.
      - name: Upload rendered video artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-published-${{ github.run_number }}
          path: out/SucKhoe-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated publish queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/published.json
          git diff --staged --quiet || git commit -m "Mark next Suc Khoe episode as published [skip ci]"
          git pull --rebase
          git push

  # Every 6 hours (see the schedule trigger above): same as
  # publish-next-suckhoe but for the separate English-market channel
  # (locale "en" episodes, own queue position within published.json, own
  # credentials). See scripts/publish-next-suckhoe.mjs --locale=en.
  publish-next-suckhoe-en:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 0,12,18 * * *') || github.event.inputs.video == 'suckhoe-en-publish-next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish next queued episode (English channel)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          YOUTUBE_EN_PRIVACY_STATUS: ${{ vars.YOUTUBE_EN_PRIVACY_STATUS }}
        run: npm run publish-next:suckhoe-en

      - name: Upload rendered video artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-en-published-${{ github.run_number }}
          path: out/SucKhoe-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit updated publish queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/published.json
          git diff --staged --quiet || git commit -m "Mark next Suc Khoe (EN) episode as published [skip ci]"
          git pull --rebase
          git push

  # Three times daily (see the schedule trigger above): release exactly
  # one shelved/privated video back to public. See
  # scripts/release-shelved-video.mjs and src/suckhoe/shelved-videos.json.
  release-shelved-suckhoe:
    if: (github.event_name == 'schedule' && github.event.schedule == '20 2,10,18 * * *') || github.event.inputs.video == 'release-shelved-suckhoe'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release next shelved video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run release-shelved:suckhoe

      - name: Commit updated shelf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/shelved-videos.json
          git diff --staged --quiet || git commit -m "Release next shelved Suc Khoe video [skip ci]"
          git pull --rebase
          git push

  # Once daily (see the schedule trigger above): print real channel/video
  # stats to the job log. Deliberately not committed to the repo — this is
  # a read, not state — read it via the Actions UI or the GitHub API.
  channel-report:
    if: (github.event_name == 'schedule' && github.event.schedule == '40 0 * * *') || github.event.inputs.video == 'channel-report'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 00:00 UTC coincides with the English publish schedule's 0h slot
    # (2026-08-23 fixed-hour reschedule) — same concurrency group as the
    # publish jobs so they serialize instead of racing a push to main.
    concurrency:
      group: suckhoe-publish-queue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull channel + video stats (Vietnamese)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run channel-report -- --locale=vi

      # Separate Google account/channel — own refresh token, own report
      # file. Written to src/suckhoe/channel-report-en.md so the daily
      # content writer can lean into what's actually working for THAT
      # audience, not the Vietnamese one's numbers.
      - name: Pull channel + video stats (English)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
        run: npm run channel-report -- --locale=en

      - name: Commit updated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/channel-report-vi.md src/suckhoe/channel-report-en.md
          git diff --staged --quiet || git commit -m "Update channel performance reports [skip ci]"
          git pull --rebase
          git push

  # Manual incident-response tool, dispatch-only — set specific existing
  # videos private/public/unlisted by ID. See scripts/set-video-privacy.mjs.
  set-video-privacy:
    if: github.event.inputs.video == 'set-video-privacy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set video privacy
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/set-video-privacy.mjs ${{ github.event.inputs.privacy_status }} ${{ github.event.inputs.video_ids }}

  # Experimental long-form (~20 min, landscape) format — a single
  # continuous story per episode, testing viewer interest ahead of
  # eventually building this out once the channel is YPP-eligible.
  # Manual/dispatch-only, not on any schedule — generates voiceover,
  # renders, and uploads (private by default) exactly one long-form
  # episode by slug. See src/suckhoe/long-form/.
  suckhoe-long:
    if: github.event.inputs.video == 'suckhoe-long'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate voiceover for this episode
        run: node scripts/generate-voiceover.mjs suckhoe-long-${{ github.event.inputs.long_form_slug }}

      - name: Render episode
        run: node scripts/render-suckhoe-long.mjs ${{ github.event.inputs.long_form_slug }}

      # Thumbnail is nice-to-have — a failure here must never skip the
      # upload (observed 2026-10-09: missing drawtext on the runner's
      # ffmpeg killed the step and the whole publish).
      - name: Make thumbnail
        continue-on-error: true
        run: node scripts/make-long-thumbnail.mjs ${{ github.event.inputs.long_form_slug }}

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-long-${{ github.event.inputs.long_form_slug }}
          path: out/SucKhoeLong-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to YouTube (private by default)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          YOUTUBE_LONG_PRIVACY_STATUS: ${{ vars.YOUTUBE_LONG_PRIVACY_STATUS }}
        run: node scripts/upload-youtube-long.mjs ${{ github.event.inputs.long_form_slug }}

      - name: Commit long-form ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/published-long.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Record long-form upload ${{ github.event.inputs.long_form_slug }} [skip ci]"
          git pull --rebase --autostash
          git push

  # Scheduled long-form publisher (owner directive 2026-10-09: 3-4
  # long videos/day). Runs the same pipeline as the suckhoe-long
  # dispatch job, but picks the slug itself via
  # scripts/next-long-form-slug.mjs and exits quietly when every
  # episode in src/suckhoe/long-form/ already has a ledger videoId.
  suckhoe-long-next:
    if: github.event_name == 'schedule' && github.event.schedule == '30 21,3,9,15 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: suckhoe-long-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pick next unpublished long-form episode
        id: pick
        run: |
          SLUG=$(node scripts/next-long-form-slug.mjs)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if [ -z "$SLUG" ]; then echo "No unpublished long-form episode left."; fi

      - name: Generate voiceover for this episode
        if: steps.pick.outputs.slug != ''
        run: node scripts/generate-voiceover.mjs suckhoe-long-${{ steps.pick.outputs.slug }}

      - name: Render episode
        if: steps.pick.outputs.slug != ''
        run: node scripts/render-suckhoe-long.mjs ${{ steps.pick.outputs.slug }}

      # Thumbnail is nice-to-have — never blocks the upload.
      - name: Make thumbnail
        if: steps.pick.outputs.slug != ''
        continue-on-error: true
        run: node scripts/make-long-thumbnail.mjs ${{ steps.pick.outputs.slug }}

      - name: Upload video artifact
        if: always() && steps.pick.outputs.slug != ''
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: suckhoe-long-${{ steps.pick.outputs.slug }}
          path: out/SucKhoeLong-*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload to YouTube
        if: steps.pick.outputs.slug != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
          # Scheduled runs publish straight to public — private-by-default
          # only makes sense for manual dispatch reviews.
          YOUTUBE_LONG_PRIVACY_STATUS: public
        run: node scripts/upload-youtube-long.mjs ${{ steps.pick.outputs.slug }}

      - name: Commit long-form ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/suckhoe/published-long.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Record long-form upload ${{ steps.pick.outputs.slug }} [skip ci]"
          git pull --rebase --autostash
          git push
