name: Daily Suc Khoe content writer

# Keeps the Suc Khoe episode queue topped up so publish-next-suckhoe (in
# render.yml) never runs dry. Was originally a local Windows Task Scheduler
# job, but that machine has a security policy that silently blocks
# Task-Scheduler-launched processes (confirmed: identical command works
# fine run directly, produces zero output/log when launched via
# `schtasks /Run`, no admin rights available to diagnose further) — same
# category of local constraint that already forced rendering/uploading off
# this machine. Moving content-writing here too removes the dependency on
# any local machine being on, logged in, and unblocked.
#
# No-ops harmlessly (same pattern as the YouTube upload steps elsewhere in
# this repo) until ANTHROPIC_API_KEY is added as a repo secret. This uses
# real Anthropic API billing (not a Claude subscription) — a small cost per
# run, roughly proportional to how much reading/writing the model does for
# one batch of episodes. Watch usage on https://console.anthropic.com/ for
# the first few runs to see the actual per-run cost before trusting it
# long-term.

on:
  workflow_dispatch: {}
  schedule:
    # Once daily. Timed well ahead of the every-4h publish cadence so a
    # fresh batch of episodes is committed before the queue could run dry.
    - cron: "0 20 * * *"

jobs:
  write-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run daily content writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Skipping: ANTHROPIC_API_KEY secret not set. Add it under repo Settings > Secrets and variables > Actions to enable this job."
            exit 0
          fi
          claude -p "$(cat scripts/daily-content-writer-prompt.txt)" \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep" \
            --dangerously-skip-permissions
